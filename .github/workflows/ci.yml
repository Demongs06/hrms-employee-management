name: HRMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit and test backend
        run: |
          cd backend
          npm install
          npm audit fix
          npm audit --audit-level=moderate
          npm test

      - name: Audit, test and build frontend
        run: |
          cd frontend
          rm -f package-lock.json
          npm install
          npm update
          npm audit --audit-level=moderate
          npm run test -- --run
          npm run build

      - name: Save refreshed dependency lockfiles
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfiles are already up to date."
          else
            git commit -m "Update dependency lockfiles after security fixes"
            git push
          fi
